<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EcoHéroe 3D - Naturaleza Viva</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a1a0f;
    font-family: 'Nunito', sans-serif;
    touch-action: none;
}

#gameCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* ===== HUD MODERNO ===== */
#hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    pointer-events: none;
    padding: max(env(safe-area-inset-top, 12px), 12px) 16px 0;
}

.hud-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
}

.hud-card {
    background: rgba(10, 25, 15, 0.88);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 12px 16px;
    border: 1px solid rgba(100, 220, 120, 0.5);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.hud-lbl {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #a5ffb0;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.hud-val {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    line-height: 1;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.bar-container {
    width: 130px;
    height: 10px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    overflow: hidden;
    margin: 6px 0;
}

.bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 6px currentColor;
}

#eFill {
    background: linear-gradient(90deg, #ffb347, #ff6b35);
    box-shadow: 0 0 8px #ff6b35;
}

#bFill {
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    box-shadow: 0 0 8px #4facfe;
}

#timerCard {
    min-width: 100px;
    text-align: center;
}

#timerNum {
    font-family: 'Fredoka One', cursive;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #f0f0f0;
    text-shadow: 0 0 10px rgba(100,220,120,0.5);
}

#timerNum.urgent {
    color: #ff5252;
    animation: pulse 0.6s infinite;
}

@keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.6; transform: scale(1.02); }
}

/* ===== JOYSTICK ===== */
#joystickZone {
    position: fixed;
    bottom: max(env(safe-area-inset-bottom, 20px), 20px);
    left: 20px;
    width: 140px;
    height: 140px;
    z-index: 30;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
}

#joystickBase {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(100, 220, 120, 0.6);
}

#joystickKnob {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6eff8e, #2ecc71);
    border: 2px solid rgba(255,255,255,0.8);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: transform 0.02s linear;
}

/* ===== BOTONES ACCIÓN ===== */
#actionBtns {
    position: fixed;
    bottom: max(env(safe-area-inset-bottom, 20px), 20px);
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 30;
}

.act-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    transition: transform 0.1s;
    background: radial-gradient(circle at 30% 30%, #fff, #ddd);
}

.act-btn:active {
    transform: scale(0.92);
}

#btnCollect {
    background: radial-gradient(circle at 35% 35%, #5ade7a, #27ae60);
    border: 2px solid rgba(255,255,200,0.8);
}

#btnEmpty {
    background: radial-gradient(circle at 35% 35%, #5aade0, #2471a3);
    border: 2px solid rgba(255,255,200,0.8);
}

.act-lbl {
    font-size: 9px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.8px;
    margin-top: 2px;
}

/* ===== MINIMAP ===== */
#minimap {
    position: fixed;
    bottom: max(env(safe-area-inset-bottom, 20px), 180px);
    right: 20px;
    width: 110px;
    height: 110px;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(100, 220, 120, 0.6);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    z-index: 20;
}

#mmCanvas {
    width: 100%;
    height: 100%;
}

/* ===== POPUP BASURA ===== */
#trashPop {
    position: fixed;
    bottom: max(env(safe-area-inset-bottom, 20px), 210px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    border: 1.5px solid #64dc78;
    border-radius: 60px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    z-index: 20;
    display: none;
    white-space: nowrap;
    pointer-events: none;
}

/* ===== NOTIFICACIÓN ===== */
#notif {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(20px);
    border: 2px solid #6eff8e;
    border-radius: 32px;
    padding: 20px 28px;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #6eff8e;
    text-align: center;
    z-index: 60;
    display: none;
    box-shadow: 0 0 60px rgba(100, 220, 120, 0.5);
    animation: notifPop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
}

@keyframes notifPop {
    from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ===== PANTALLAS ===== */
.screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: radial-gradient(ellipse at 50% 30%, #1a4a2a, #0a1a0f 85%);
    padding: 20px;
}

.logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(44px, 12vw, 80px);
    background: linear-gradient(135deg, #6eff8e, #34d89e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(100,220,120,0.6);
}

.logo-sub {
    font-size: 14px;
    letter-spacing: 4px;
    color: #b0ffc0;
    margin-bottom: 32px;
}

.lvl-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 380px;
    margin-bottom: 32px;
}

.lvl-card {
    background: linear-gradient(145deg, rgba(30,50,30,0.85), rgba(20,40,20,0.9));
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(100, 220, 120, 0.4);
    border-radius: 24px;
    padding: 18px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
}

.lvl-card:active { transform: scale(0.96); }
.lvl-card.locked { opacity: 0.45; filter: grayscale(0.3); }
.lvl-icon { font-size: 38px; margin-bottom: 8px; }
.lvl-name { font-family: 'Fredoka One', cursive; font-size: 18px; color: #fff; }
.lvl-diff { font-size: 10px; color: #aaa; margin-top: 4px; }
.lvl-stars { font-size: 14px; color: #ffd966; margin-top: 6px; }

.btn {
    background: linear-gradient(135deg, #64dc78, #34d89e);
    color: #0a1628;
    border: none;
    border-radius: 60px;
    padding: 14px 36px;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(100, 220, 120, 0.4);
    transition: transform 0.1s;
    margin: 6px;
}

.btn:active { transform: scale(0.96); }
.btn-sec { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); color: white; box-shadow: none; }

#btnPause {
    position: fixed;
    top: max(env(safe-area-inset-top, 12px), 70px);
    right: 16px;
    z-index: 25;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(12px);
    border: 1.5px solid #64dc78;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 22px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
}

#resTitle { font-family: 'Fredoka One', cursive; font-size: clamp(32px, 8vw, 56px); margin-bottom: 12px; }
#resStars { font-size: 52px; margin: 12px 0; letter-spacing: 8px; }
#resStats { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 16px 24px; border-radius: 28px; font-size: 15px; line-height: 1.9; text-align: center; margin-bottom: 24px; }
</style>
</head>
<body>

<div id="menuScreen" class="screen">
    <div class="logo">🌿 EcoHéroe</div>
    <div class="logo-sub">Naturaleza Viva · 3D</div>
    <div class="lvl-grid">
        <div class="lvl-card" id="card0" onclick="startLevel(0)">
            <div class="lvl-icon">🏖️🌴</div>
            <div class="lvl-name">Playa Tropical</div>
            <div class="lvl-diff">Fácil · 14 residuos</div>
            <div class="lvl-stars" id="stars0">☆☆☆</div>
        </div>
        <div class="lvl-card locked" id="card1" onclick="startLevel(1)">
            <div class="lvl-icon">🌳🍃🌲</div>
            <div class="lvl-name">Bosque Encantado</div>
            <div class="lvl-diff">Medio · 22 residuos</div>
            <div class="lvl-stars" id="stars1">☆☆☆</div>
            <div class="lock-badge" id="lock1" style="position:absolute;top:8px;right:12px;font-size:18px;">🔒</div>
        </div>
        <div class="lvl-card locked" id="card2" onclick="startLevel(2)">
            <div class="lvl-icon">🏙️🌳🌿</div>
            <div class="lvl-name">Ciudad Verde</div>
            <div class="lvl-diff">Difícil · 30 residuos</div>
            <div class="lvl-stars" id="stars2">☆☆☆</div>
            <div class="lock-badge" id="lock2" style="position:absolute;top:8px;right:12px;font-size:18px;">🔒</div>
        </div>
    </div>
    <button class="btn" onclick="startLevel(0)">🌱 COMENZAR AVENTURA</button>
    <button class="btn btn-sec" onclick="showHelp()">📖 CÓMO JUGAR</button>
</div>

<div id="pauseScreen" class="screen" style="display:none;">
    <h2 style="font-family:'Fredoka One';font-size:52px;color:#64dc78;">⏸ PAUSA</h2>
    <button class="btn" onclick="resumeGame()">▶ CONTINUAR</button>
    <button class="btn btn-sec" onclick="goMenu()">🏠 MENÚ</button>
</div>

<div id="resultScreen" class="screen" style="display:none;">
    <div id="resTitle">✨ ¡Nivel Completado! ✨</div>
    <div id="resStars">⭐⭐⭐</div>
    <div id="resStats"></div>
    <button class="btn" id="btnNext" onclick="nextLevel()">🎮 SIGUIENTE</button>
    <button class="btn btn-sec" onclick="goMenu()">🏠 MENÚ</button>
</div>

<div id="hud" style="display:none;">
    <div class="hud-row">
        <div class="hud-card">
            <div class="hud-lbl">⚡ ENERGÍA</div>
            <div class="bar-container"><div class="bar-fill" id="eFill" style="width:100%"></div></div>
            <div class="hud-lbl" style="margin-top:8px;">🎒 BOLSA</div>
            <div class="bar-container"><div class="bar-fill" id="bFill" style="width:0%"></div></div>
        </div>
        <div class="hud-card" id="timerCard">
            <div class="hud-lbl">⏱ TIEMPO</div>
            <div id="timerNum">2:00</div>
        </div>
        <div class="hud-card">
            <div class="hud-lbl">🗑 LIMPIEZA</div>
            <div class="hud-val" id="trashCnt">0/0</div>
            <div class="hud-lbl" style="margin-top:6px;">🪙 MONEDAS</div>
            <div class="hud-val" id="coinsCnt">0</div>
        </div>
    </div>
</div>

<div id="btnPause" onclick="pauseGame()">⏸</div>
<div id="trashPop"></div>
<div id="notif"><div id="notifTxt"></div><div id="notifSub"></div></div>

<div id="joystickZone"><div id="joystickBase"></div><div id="joystickKnob"></div></div>

<div id="actionBtns">
    <button class="act-btn" id="btnCollect" ontouchstart="tryCollect();return false;" onclick="tryCollect()">🤚<div class="act-lbl">RECOGER</div></button>
    <button class="act-btn" id="btnEmpty" ontouchstart="emptyBag();return false;" onclick="emptyBag()">♻️<div class="act-lbl">VACIAR</div></button>
</div>

<div id="minimap" style="display:none;"><canvas id="mmCanvas" width="110" height="110"></canvas></div>
<canvas id="gameCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ============================================================
// ECOHÉROE 3D - NATURALEZA VIVA CON MÁS ÁRBOLES Y FIGURAS DE BASURA
// ============================================================

const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a2a1a);
scene.fog = new THREE.FogExp2(0x0a2a1a, 0.008);

const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 200);

function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ========== NIVELES CON MÁS NATURALEZA ==========
const LEVELS = [
    { name: 'Playa Tropical', icon: '🏖️', time: 130, trashCount: 14, mapSize: 32,
      bgColor: 0x6ab0de, groundColor: 0xe8c87a, fogColor: 0x9ac4e4, fogDensity: 0.01,
      treesCount: 25, palmsCount: 18, flowersCount: 30, desc: '¡Salva las tortugas marinas!' },
    { name: 'Bosque Encantado', icon: '🌳', time: 110, trashCount: 22, mapSize: 40,
      bgColor: 0x5f9e6e, groundColor: 0x6aab5a, fogColor: 0x88bb88, fogDensity: 0.008,
      treesCount: 45, palmsCount: 8, flowersCount: 50, desc: 'Un bosque mágico necesita tu ayuda' },
    { name: 'Ciudad Verde', icon: '🏙️', time: 90, trashCount: 30, mapSize: 48,
      bgColor: 0x4a658c, groundColor: 0x7e8c8d, fogColor: 0x6a7b9c, fogDensity: 0.007,
      treesCount: 30, palmsCount: 12, flowersCount: 40, desc: 'La ciudad sostenible te espera' }
];

const TRASH_TYPES = {
    plastic: { color: 0x5dade2, label: 'Botella Plástica', pts: 10, coin: 2, sym: '🥤', shape: 'bottle' },
    glass: { color: 0x58d68d, label: 'Frasco de Vidrio', pts: 15, coin: 3, sym: '🍾', shape: 'cylinder' },
    organic: { color: 0xeb984e, label: 'Cáscara Orgánica', pts: 8, coin: 1, sym: '🍌', shape: 'sphere' },
    toxic: { color: 0xc0392b, label: 'Batería Tóxica', pts: 25, coin: 5, sym: '⚠️', shape: 'cube' },
    lata: { color: 0xbdc3c7, label: 'Lata de Aluminio', pts: 12, coin: 2, sym: '🥫', shape: 'cylinder' },
    carton: { color: 0xd4ac6e, label: 'Cartón', pts: 9, coin: 1, sym: '📦', shape: 'box' }
};

let state = 'menu', currentLevel = 0, unlockedLevels = 1;
let savedStars = [0,0,0];
const player = { x:0, z:0, angle:0, energy:100, maxEnergy:100, bag:[], bagMax:6, coins:0, score:0, mesh:null };
let trashItems = [], obstaclesList = [], binsList = [], natureObjects = [];
let timeLeft = 120, totalTrash = 0, collectedTrash = 0;
let timerInterval = null, notifTimeout = null;
let clock = new THREE.Clock();
let joyX = 0, joyZ = 0, joyActive = false;
const JOY_MAX = 50;

// Joystick
const jZone = document.getElementById('joystickZone');
const jKnob = document.getElementById('joystickKnob');
let joyOriginActive = false;

function updateJoystick(cx, cy) {
    const rect = jZone.getBoundingClientRect();
    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;
    let dx = cx - centerX, dy = cy - centerY;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_MAX) { dx = dx / dist * JOY_MAX; dy = dy / dist * JOY_MAX; }
    jKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyX = dx / JOY_MAX; joyZ = dy / JOY_MAX;
    joyActive = true;
}
function resetJoystick() { jKnob.style.transform = 'translate(-50%,-50%)'; joyX = 0; joyZ = 0; joyActive = false; }

jZone.addEventListener('touchstart', (e) => { e.preventDefault(); updateJoystick(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
jZone.addEventListener('touchmove', (e) => { e.preventDefault(); updateJoystick(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
jZone.addEventListener('touchend', () => resetJoystick());
jZone.addEventListener('mousedown', (e) => { joyOriginActive = true; updateJoystick(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { if (joyOriginActive) updateJoystick(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { joyOriginActive = false; resetJoystick(); });

const keys = {};
document.addEventListener('keydown', (e) => { keys[e.code] = true; if(e.code === 'Space') { e.preventDefault(); tryCollect(); } if(e.code === 'KeyE') emptyBag(); });
document.addEventListener('keyup', (e) => keys[e.code] = false);

// ========== NATURALEZA: ÁRBOLES, PALMERAS, FLORES, ROCAS ==========
function createTree(x, z) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0x6b4c3b, roughness: 0.7 }));
    trunk.position.y = 1.1; trunk.castShadow = true; group.add(trunk);
    const foliage1 = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.3, 8), new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.4 }));
    foliage1.position.y = 2.1; foliage1.castShadow = true; group.add(foliage1);
    const foliage2 = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.1, 8), new THREE.MeshStandardMaterial({ color: 0x66bb6a }));
    foliage2.position.y = 3.0; foliage2.castShadow = true; group.add(foliage2);
    const foliage3 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0x81c784 }));
    foliage3.position.y = 3.8; foliage3.castShadow = true; group.add(foliage3);
    group.position.set(x, 0, z);
    scene.add(group);
    return group;
}

function createPalm(x, z) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.38, 2.8, 8), new THREE.MeshStandardMaterial({ color: 0xbc9a6c, roughness: 0.8 }));
    trunk.position.y = 1.4; trunk.castShadow = true; group.add(trunk);
    for(let i=0; i<6; i++) {
        const leaf = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.28, 1.5, 4), new THREE.MeshStandardMaterial({ color: 0x5dac41 }));
        const angle = (i / 6) * Math.PI * 2;
        leaf.rotation.z = 0.8; leaf.rotation.x = angle;
        leaf.position.set(Math.cos(angle)*0.85, 3.0, Math.sin(angle)*0.85);
        leaf.castShadow = true;
        group.add(leaf);
    }
    group.position.set(x, 0, z);
    scene.add(group);
    return group;
}

function createFlower(x, z, color) {
    const group = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.4, 4), new THREE.MeshStandardMaterial({ color: 0x6b8e23 }));
    stem.position.y = 0.2; group.add(stem);
    const petals = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6), new THREE.MeshStandardMaterial({ color: color }));
    petals.position.y = 0.45; group.add(petals);
    group.position.set(x, 0, z);
    scene.add(group);
    return group;
}

function createRock(x, z, size) {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size), new THREE.MeshStandardMaterial({ color: 0x8a8f8f, roughness: 0.9 }));
    rock.position.set(x, size*0.4, z);
    rock.castShadow = true;
    scene.add(rock);
    return rock;
}

// ========== BASURA CON FIGURAS DIFERENTES ==========
function createTrashMesh(type, x, z) {
    const info = TRASH_TYPES[type];
    let geometry;
    if(info.shape === 'bottle') geometry = new THREE.CylinderGeometry(0.18, 0.22, 0.55, 8);
    else if(info.shape === 'cylinder') geometry = new THREE.CylinderGeometry(0.2, 0.2, 0.45, 8);
    else if(info.shape === 'sphere') geometry = new THREE.SphereGeometry(0.23, 8);
    else if(info.shape === 'box') geometry = new THREE.BoxGeometry(0.38, 0.32, 0.38);
    else geometry = new THREE.BoxGeometry(0.35, 0.35, 0.35);
    
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: info.color, roughness: 0.3, metalness: 0.1 }));
    mesh.position.set(x, 0.2, z);
    mesh.castShadow = true;
    mesh.userData = { type: type, collected: false, bobOffset: Math.random() * Math.PI * 2 };
    
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.52, 8), 
        new THREE.MeshStandardMaterial({ color: info.color, emissive: info.color, emissiveIntensity: 0.25, transparent: true, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI/2;
    ring.position.set(x, 0.05, z);
    scene.add(ring);
    mesh.userData.ring = ring;
    scene.add(mesh);
    return mesh;
}

// ========== CONSTRUIR NIVEL CON MÁS NATURALEZA ==========
function setupLighting(lvl) {
    while(scene.children.length) scene.remove(scene.children[0]);
    scene.background = new THREE.Color(LEVELS[lvl].bgColor);
    scene.fog = new THREE.FogExp2(LEVELS[lvl].fogColor, LEVELS[lvl].fogDensity);
    const ambient = new THREE.AmbientLight(0x505570, 0.7);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
    sun.position.set(18, 32, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);
    const fill = new THREE.PointLight(0x88aaff, 0.4);
    fill.position.set(-8, 12, -6);
    scene.add(fill);
}

function buildLevel(lvl) {
    const cfg = LEVELS[lvl];
    const half = cfg.mapSize/2 - 1.8;
    obstaclesList = [];
    binsList = [];
    natureObjects = [];
    
    // Suelo con textura
    const groundMat = new THREE.MeshStandardMaterial({ color: cfg.groundColor, roughness: 0.8, metalness: 0.05 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(cfg.mapSize, cfg.mapSize, 32, 32), groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    // Grid decorativo
    const grid = new THREE.GridHelper(cfg.mapSize, 24, 0xaaffaa, 0x66aa66);
    grid.position.y = 0.03;
    grid.material.transparent = true;
    grid.material.opacity = 0.2;
    scene.add(grid);
    
    // BORDES INVISIBLES
    const borderW = 1;
    [-half, half].forEach(z => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(cfg.mapSize, 2, borderW), new THREE.MeshStandardMaterial({ visible: false }));
        wall.position.set(0, 0.5, z);
        scene.add(wall);
        obstaclesList.push({ pos: { x:0, z:z }, w: cfg.mapSize/2, d: borderW/2, isBox: true });
    });
    [-half, half].forEach(x => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(borderW, 2, cfg.mapSize), new THREE.MeshStandardMaterial({ visible: false }));
        wall.position.set(x, 0.5, 0);
        scene.add(wall);
        obstaclesList.push({ pos: { x:x, z:0 }, w: borderW/2, d: cfg.mapSize/2, isBox: true });
    });
    
    // ===== MUCHA NATURALEZA =====
    // Árboles grandes
    for(let i=0; i<cfg.treesCount; i++) {
        let x = (Math.random() - 0.5) * cfg.mapSize * 0.75;
        let z = (Math.random() - 0.5) * cfg.mapSize * 0.75;
        if(Math.abs(x) < 3.5 && Math.abs(z) < 3.5) continue;
        createTree(x, z);
        obstaclesList.push({ pos: { x, z }, r: 0.65, isCircle: true });
    }
    // Palmeras
    for(let i=0; i<cfg.palmsCount; i++) {
        let x = (Math.random() - 0.5) * cfg.mapSize * 0.8;
        let z = (Math.random() - 0.5) * cfg.mapSize * 0.8;
        if(Math.abs(x) < 3 && Math.abs(z) < 3) continue;
        createPalm(x, z);
        obstaclesList.push({ pos: { x, z }, r: 0.55, isCircle: true });
    }
    // Flores de colores
    const flowerColors = [0xff69b4, 0xffdd77, 0xffaa66, 0xdd88ff, 0x66ffcc];
    for(let i=0; i<cfg.flowersCount; i++) {
        let x = (Math.random() - 0.5) * cfg.mapSize * 0.85;
        let z = (Math.random() - 0.5) * cfg.mapSize * 0.85;
        if(Math.abs(x) < 2.5 && Math.abs(z) < 2.5) continue;
        createFlower(x, z, flowerColors[i % flowerColors.length]);
    }
    // Rocas decorativas
    for(let i=0; i<15; i++) {
        let x = (Math.random() - 0.5) * cfg.mapSize * 0.7;
        let z = (Math.random() - 0.5) * cfg.mapSize * 0.7;
        if(Math.hypot(x, z) < 3) continue;
        createRock(x, z, 0.25 + Math.random()*0.2);
    }
    
    // Contenedores de reciclaje
    const binPositions = [[-half+2.5, -half+2.5], [half-2.5, -half+2.5], [-half+2.5, half-2.5], [half-2.5, half-2.5]];
    const binTypes = ['plastic', 'glass', 'organic', 'toxic'];
    const binColors = [0x5dade2, 0x58d68d, 0xeb984e, 0xc0392b];
    binTypes.forEach((t, i) => {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.45, 1.0, 10), new THREE.MeshStandardMaterial({ color: binColors[i], roughness: 0.3 }));
        body.position.y = 0.55; body.castShadow = true; group.add(body);
        const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.12, 8), new THREE.MeshStandardMaterial({ color: 0xccaa77, metalness: 0.4 }));
        lid.position.y = 1.08; group.add(lid);
        group.position.set(binPositions[i][0], 0, binPositions[i][1]);
        group.userData = { type: t };
        scene.add(group);
        binsList.push(group);
    });
}

function spawnTrashLevel(lvl) {
    trashItems = [];
    const cfg = LEVELS[lvl];
    const trashTypeList = ['plastic', 'glass', 'organic', 'toxic', 'lata', 'carton'];
    const trashRatios = [0.25, 0.18, 0.22, 0.1, 0.15, 0.1];
    
    for(let idx=0; idx<trashTypeList.length; idx++) {
        let count = Math.floor(cfg.trashCount * trashRatios[idx]);
        for(let i=0; i<count; i++) {
            let x, z, safe=false;
            for(let tries=0; tries<40; tries++) {
                x = (Math.random() - 0.5) * cfg.mapSize * 0.8;
                z = (Math.random() - 0.5) * cfg.mapSize * 0.8;
                if(Math.abs(x) < 2.2 && Math.abs(z) < 2.2) continue;
                let collision = false;
                for(let ob of obstaclesList) {
                    if(ob.isBox) continue;
                    if(Math.hypot(x - ob.pos.x, z - ob.pos.z) < 1.0) collision = true;
                }
                if(!collision) { safe=true; break; }
            }
            if(safe || i<3) {
                const trashMesh = createTrashMesh(trashTypeList[idx], x, z);
                trashItems.push(trashMesh);
            }
        }
    }
    totalTrash = trashItems.length;
    collectedTrash = 0;
}

function buildPlayerModel() {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.3, 8), new THREE.MeshStandardMaterial({ color: 0x3eac6a, roughness: 0.3 }));
    body.position.y = 0.85; body.castShadow = true; group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16), new THREE.MeshStandardMaterial({ color: 0xf8c471 }));
    head.position.y = 1.65; head.castShadow = true; group.add(head);
    const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.6, 0.28, 8), new THREE.MeshStandardMaterial({ color: 0x2ecc71 }));
    hat.position.y = 1.98; group.add(hat);
    const bag = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.35), new THREE.MeshStandardMaterial({ color: 0x9b59b6 }));
    bag.position.set(0, 1.0, -0.5); group.add(bag);
    group.position.set(player.x, 0, player.z);
    scene.add(group);
    return group;
}

// ========== GAME LOGIC ==========
function updateGame(dt) {
    if(state !== 'playing') return;
    const cfg = LEVELS[currentLevel];
    const half = cfg.mapSize/2 - 1.5;
    let mx = joyX, mz = joyZ;
    if(keys['KeyW'] || keys['ArrowUp']) mz -= 1;
    if(keys['KeyS'] || keys['ArrowDown']) mz += 1;
    if(keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if(keys['KeyD'] || keys['ArrowRight']) mx += 1;
    const mag = Math.hypot(mx, mz);
    if(mag > 0.05) {
        let nx = player.x + (mx/mag) * 6.5 * dt;
        let nz = player.z + (mz/mag) * 6.5 * dt;
        nx = Math.max(-half, Math.min(half, nx));
        nz = Math.max(-half, Math.min(half, nz));
        let collide = false;
        for(let ob of obstaclesList) {
            if(ob.isBox) {
                if(Math.abs(nx - ob.pos.x) < (ob.w+0.55) && Math.abs(nz - ob.pos.z) < (ob.d+0.55)) collide = true;
            } else {
                if(Math.hypot(nx - ob.pos.x, nz - ob.pos.z) < (ob.r+0.5)) collide = true;
            }
        }
        if(!collide) player.x = nx;
        collide = false;
        for(let ob of obstaclesList) {
            if(ob.isBox) {
                if(Math.abs(player.x - ob.pos.x) < (ob.w+0.55) && Math.abs(nz - ob.pos.z) < (ob.d+0.55)) collide = true;
            } else {
                if(Math.hypot(player.x - ob.pos.x, nz - ob.pos.z) < (ob.r+0.5)) collide = true;
            }
        }
        if(!collide) player.z = nz;
        player.angle = Math.atan2(mx, mz);
        player.energy = Math.max(0, player.energy - dt * 2.0);
    } else {
        player.energy = Math.min(player.maxEnergy, player.energy + dt * 5.5);
    }
    if(player.mesh) {
        player.mesh.position.x = player.x;
        player.mesh.position.z = player.z;
        player.mesh.rotation.y = player.angle;
        player.mesh.position.y = Math.sin(Date.now() * 0.012) * 0.02;
    }
    const targetCam = new THREE.Vector3(player.x, 8, player.z + 12);
    camera.position.lerp(targetCam, 0.09);
    camera.lookAt(player.x, 1.2, player.z);
    
    let nearest = null, nearDist = 2.6;
    trashItems.forEach(t => {
        if(!t.userData.collected) {
            const d = Math.hypot(t.position.x - player.x, t.position.z - player.z);
            if(d < nearDist) { nearDist = d; nearest = t; }
        }
    });
    const pop = document.getElementById('trashPop');
    if(nearest) {
        const info = TRASH_TYPES[nearest.userData.type];
        pop.textContent = `🤚  RECOGER  ${info.sym}  ${info.label}`;
        pop.style.display = 'block';
    } else pop.style.display = 'none';
}

function animateTrashFloat() {
    const t = Date.now() * 0.0035;
    trashItems.forEach(item => {
        if(!item.userData.collected) {
            item.position.y = 0.2 + Math.sin(t + item.userData.bobOffset) * 0.09;
            item.rotation.y += 0.025;
            item.rotation.x = Math.sin(t * 1.5) * 0.1;
            if(item.userData.ring) {
                const s = 0.7 + Math.sin(t*2.5) * 0.25;
                item.userData.ring.scale.setScalar(s);
            }
        }
    });
}

function tryCollect() {
    if(state !== 'playing') return;
    if(player.bag.length >= player.bagMax) { showNotif('🎒 ¡Bolsa llena!', 'Vacía en un contenedor ♻️'); return; }
    let nearest = null, best = 2.6;
    trashItems.forEach(t => {
        if(!t.userData.collected && Math.hypot(t.position.x - player.x, t.position.z - player.z) < best) {
            best = Math.hypot(t.position.x - player.x, t.position.z - player.z);
            nearest = t;
        }
    });
    if(nearest) {
        nearest.userData.collected = true;
        nearest.visible = false;
        if(nearest.userData.ring) nearest.userData.ring.visible = false;
        player.bag.push(nearest.userData.type);
        showNotif(`📦 +1 ${TRASH_TYPES[nearest.userData.type].label}`, 'Llévalo al contenedor correcto');
    } else showNotif('❌ Sin basura cerca', 'Acércate más');
    updateHUD();
}

function emptyBag() {
    if(state !== 'playing') return;
    if(player.bag.length === 0) { showNotif('🔄 Bolsa vacía', 'Recoge basura primero'); return; }
    let nearestBin = null, bestDist = 2.8;
    binsList.forEach(b => {
        const d = Math.hypot(b.position.x - player.x, b.position.z - player.z);
        if(d < bestDist) { bestDist = d; nearestBin = b; }
    });
    if(!nearestBin) { showNotif('♻️ Busca un contenedor', 'Están en las esquinas'); return; }
    let correct = 0, wrong = 0, pts = 0, coins = 0;
    player.bag.forEach(type => {
        const info = TRASH_TYPES[type];
        if(type === nearestBin.userData.type) { correct++; pts += info.pts; coins += info.coin; collectedTrash++; }
        else { wrong++; pts -= 3; }
    });
    player.score += pts;
    player.coins += coins;
    player.bag = [];
    if(correct > 0 && wrong === 0) showNotif(`✅ ¡Reciclaje perfecto! +${pts} pts`, `+${coins} 🪙`);
    else if(correct > 0) showNotif(`⚠️ ${correct} bien, ${wrong} mal`, `+${pts} pts`);
    else showNotif('❌ Contenedor equivocado', 'Clasifica mejor');
    updateHUD();
    if(collectedTrash >= totalTrash) endLevel(true);
}

function updateHUD() {
    document.getElementById('eFill').style.width = (player.energy/player.maxEnergy * 100) + '%';
    document.getElementById('bFill').style.width = (player.bag.length/player.bagMax * 100) + '%';
    document.getElementById('trashCnt').innerHTML = `${collectedTrash}/${totalTrash}`;
    document.getElementById('coinsCnt').innerHTML = player.coins;
    let m = Math.floor(timeLeft/60), s = timeLeft % 60;
    const timerSpan = document.getElementById('timerNum');
    timerSpan.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if(timeLeft <= 20) timerSpan.classList.add('urgent');
    else timerSpan.classList.remove('urgent');
}

function drawMiniMap() {
    const canvasMap = document.getElementById('mmCanvas');
    const ctx = canvasMap.getContext('2d');
    const cfg = LEVELS[currentLevel];
    const half = cfg.mapSize/2;
    const sz = 110;
    ctx.fillStyle = '#2c4a2a';
    ctx.fillRect(0,0,sz,sz);
    trashItems.forEach(t => {
        if(t.userData.collected) return;
        const x = ((t.position.x + half) / cfg.mapSize) * sz;
        const z = ((t.position.z + half) / cfg.mapSize) * sz;
        ctx.fillStyle = `#${TRASH_TYPES[t.userData.type].color.toString(16).padStart(6,'0')}`;
        ctx.beginPath(); ctx.arc(x, z, 3, 0, Math.PI*2); ctx.fill();
    });
    binsList.forEach(b => {
        const x = ((b.position.x + half) / cfg.mapSize) * sz;
        const z = ((b.position.z + half) / cfg.mapSize) * sz;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x-3, z-3, 6, 6);
    });
    const px = ((player.x + half) / cfg.mapSize) * sz;
    const pz = ((player.z + half) / cfg.mapSize) * sz;
    ctx.fillStyle = '#6eff8e';
    ctx.beginPath(); ctx.arc(px, pz, 5, 0, Math.PI*2); ctx.fill();
}

function startTimerGame() {
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if(state === 'playing') {
            timeLeft--;
            updateHUD();
            if(timeLeft <= 0) { clearInterval(timerInterval); endLevel(collectedTrash >= totalTrash*0.6); }
        }
    }, 1000);
}

function endLevel(success) {
    clearInterval(timerInterval);
    state = 'result';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('btnPause').style.display = 'none';
    const pct = collectedTrash/totalTrash;
    let stars = success ? (pct >= 1 ? 3 : pct >= 0.7 ? 2 : 1) : 0;
    if(stars > savedStars[currentLevel]) savedStars[currentLevel] = stars;
    if(stars > 0 && currentLevel+1 < LEVELS.length && currentLevel+1 > unlockedLevels-1) unlockedLevels = currentLevel+2;
    document.getElementById('resTitle').innerHTML = success ? '🎉 ¡Naturaleza Salvada! 🎉' : '⏰ Tiempo Agotado';
    document.getElementById('resStars').innerHTML = stars === 3 ? '⭐⭐⭐' : stars === 2 ? '⭐⭐☆' : stars === 1 ? '⭐☆☆' : '☆☆☆';
    document.getElementById('resStats').innerHTML = `🗑 Limpiado: ${collectedTrash}/${totalTrash}<br>🏆 Puntos: ${player.score}<br>🪙 Monedas: ${player.coins}<br>🎯 Precisión: ${Math.round(pct*100)}%`;
    document.getElementById('resultScreen').style.display = 'flex';
    updateStarsMenu();
}

function startLevel(lvl) {
    if(lvl >= unlockedLevels) { showNotif('🔒 Nivel bloqueado', 'Completa el anterior'); return; }
    currentLevel = lvl;
    state = 'playing';
    player.x = 0; player.z = 0; player.energy = 100; player.bag = []; player.score = 0; player.coins = 0;
    timeLeft = LEVELS[lvl].time;
    collectedTrash = 0;
    setupLighting(lvl);
    buildLevel(lvl);
    if(player.mesh) scene.remove(player.mesh);
    player.mesh = buildPlayerModel();
    spawnTrashLevel(lvl);
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('pauseScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('minimap').style.display = 'block';
    document.getElementById('btnPause').style.display = 'flex';
    updateHUD();
    startTimerGame();
    showNotif(`🌿 ${LEVELS[lvl].name}`, LEVELS[lvl].desc, 2800);
}

function pauseGame() { if(state === 'playing') { state = 'paused'; document.getElementById('pauseScreen').style.display = 'flex'; } }
function resumeGame() { state = 'playing'; document.getElementById('pauseScreen').style.display = 'none'; }
function goMenu() {
    clearInterval(timerInterval);
    state = 'menu';
    while(scene.children.length) scene.remove(scene.children[0]);
    player.mesh = null;
    document.getElementById('pauseScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('minimap').style.display = 'none';
    document.getElementById('btnPause').style.display = 'none';
    document.getElementById('trashPop').style.display = 'none';
    document.getElementById('menuScreen').style.display = 'flex';
    updateStarsMenu();
}
function nextLevel() { if(currentLevel+1 < LEVELS.length) startLevel(currentLevel+1); else startLevel(0); }
function showNotif(msg, sub, dur=2200) {
    clearTimeout(notifTimeout);
    document.getElementById('notifTxt').innerText = msg;
    document.getElementById('notifSub').innerText = sub;
    const n = document.getElementById('notif');
    n.style.display = 'block';
    notifTimeout = setTimeout(() => n.style.display = 'none', dur);
}
function showHelp() { showNotif('🎮 Controles', 'Joystick → mover · 🤚 recoger · ♻️ vaciar en contenedor', 4500); }
function updateStarsMenu() {
    for(let i=0;i<3;i++) {
        let stars = savedStars[i];
        document.getElementById('stars'+i).innerHTML = '⭐'.repeat(stars)+'☆'.repeat(3-stars);
        const card = document.getElementById('card'+i);
        if(i < unlockedLevels) { card.classList.remove('locked'); if(document.getElementById('lock'+i)) document.getElementById('lock'+i).style.display = 'none'; }
        else { card.classList.add('locked'); if(document.getElementById('lock'+i)) document.getElementById('lock'+i).style.display = 'block'; }
    }
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.033);
    if(state === 'playing') {
        updateGame(dt);
        animateTrashFloat();
        updateHUD();
        drawMiniMap();
    }
    renderer.render(scene, camera);
}

updateStarsMenu();
animate();
</script>
